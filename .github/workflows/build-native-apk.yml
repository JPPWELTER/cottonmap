name: Build native offline APK

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'native-android-src.zip'
      - '.github/workflows/build-native-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unpack native project
        run: |
          mkdir -p native-app
          unzip -o native-android-src.zip -d native-app

      - name: Generate signing keystore
        working-directory: native-app
        run: |
          keytool -genkeypair -v \
            -keystore cottonmap-native.keystore \
            -alias cottonmap \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cottonmap123 -keypass cottonmap123 \
            -dname "CN=CottonMap, OU=CottonMap, O=CottonMap, L=Unknown, ST=Unknown, C=BR"

      - name: Build release APK
        working-directory: native-app
        env:
          COTTONMAP_KEYSTORE_PATH: cottonmap-native.keystore
          COTTONMAP_KEYSTORE_PASSWORD: cottonmap123
          COTTONMAP_KEY_ALIAS: cottonmap
          COTTONMAP_KEY_PASSWORD: cottonmap123
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate and rename APK
        working-directory: native-app
        run: |
          find . -name "*.apk"
          cp app/build/outputs/apk/release/app-release.apk CottonMap-native-offline.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CottonMap-native-offline-apk
          path: native-app/CottonMap-native-offline.apk
          retention-days: 30
